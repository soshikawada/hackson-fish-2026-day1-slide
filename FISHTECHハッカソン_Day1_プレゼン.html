<script>var DECK_VERSION = "96f97660c143";</script>
<script>
/* =====================================================================
 *  FISH × TECH HACKATHON 2026  司会用プレゼン  スライドエンジン（酒×ハッカソン版から派生）
 *  （※ 通常ここは触りません。中身の編集は slides-data.js）
 * ===================================================================== */
(function () {
  "use strict";

  /* ---------- 編集機能：保存された編集内容があればそちらを使う ---------- */
  const D = (function () {
    try {
      var o = localStorage.getItem("fishDeckOverride");
      var v = localStorage.getItem("fishDeckVersion");
      if (o && v === DECK_VERSION) return JSON.parse(o);           // 同じ版の編集内容だけ使う
      if (o) { localStorage.removeItem("fishDeckOverride"); localStorage.removeItem("fishDeckVersion"); } // 版が変わった→古い保存を破棄
    } catch (e) {}
    return DECK;                                                    // 常に最新のファイル内容
  })();

  /* ---------- 小物 ---------- */
  const $  = (s, el = document) => el.querySelector(s);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  // 入場アニメ用 data-anim を順番に振る
  const anim = (node, i) => { node.setAttribute("data-anim", String(i)); return node; };

  /* ---------- グリッチロゴ生成（3枚重ね） ---------- */
  function glitchLogo(src) {
    const w = el("div", "glitch");
    const mk = (c) => { const i = el("img", "glitch__img " + c); i.src = src; i.alt = ""; return i; };
    w.appendChild(mk("glitch__img--r"));
    w.appendChild(mk("glitch__img--b"));
    const base = mk("glitch__img--base"); base.alt = "石川の海の幸 × ハッカソン";
    w.appendChild(base);
    return w;
  }

  /* ---------- ロゴ：単体版HTMLでは埋め込み画像（LOGO_DATA）を優先＝HTMLだけ移しても消えない ---------- */
  const LOGO = (typeof LOGO_DATA !== "undefined" && LOGO_DATA) || D.meta.logo;

  /* ---------- 表彰スライドの伏せ字 ---------- */
  const MASK = "？ ？ ？";

  /* ---------- DRAFTバッジ ---------- */
  const draftBadge = () => el("div", "draft-badge", "DRAFT・要確認");

  /* =====================================================================
   *  スライドごとのレンダラ
   * ===================================================================== */
  const renderers = {

    standby(s) {
      const wrap = el("div", "slide standby");
      wrap.appendChild(anim(el("div", "sb-main font-fude", s.text || "しばらくお待ちください"), 1));
      if (s.sub) wrap.appendChild(anim(el("div", "sb-sub font-tech", s.sub), 2));
      return wrap;
    },

    cover(s) {
      const wrap = el("div", "slide cover");
      const logo = glitchLogo(LOGO);
      logo.classList.add("cover-logo"); anim(logo, 1);
      wrap.appendChild(logo);
      if (s.sub)  wrap.appendChild(anim(el("div", "cover-sub font-tech", s.sub), 2));
      if (s.fude) wrap.appendChild(anim(el("div", "cover-fude", s.fude), 3));
      if (s.date) wrap.appendChild(anim(el("div", "cover-date", s.date), 4));
      return wrap;
    },

    about(s) {
      const wrap = head(s);
      const lead = anim(el("p", "lead", s.lead), 4); wrap.appendChild(lead);
      if (s.cards) {
        const grid = anim(el("div", "grid grid-2"), 5);
        grid.style.marginTop = "30px";
        s.cards.forEach((c) => {
          const card = el("div", "card");
          const bar = el("div", "card-bar"); bar.style.background = c.bar; card.appendChild(bar);
          if (c.tag)  card.appendChild(el("span", "tag", c.tag));
          card.appendChild(el("h3", null, c.title + (c.date ? ` <span class="font-tech" style="font-size:22px;color:var(--kaga-ai)">${c.date}</span>` : "")));
          if (c.desc) card.appendChild(el("p", null, c.desc));
          grid.appendChild(card);
        });
        wrap.appendChild(grid);
      }
      return wrap;
    },

    // 箇条書き（ラベル＋本文＋補足）— 登壇者の箇条書き版など
    bullets(s) {
      const wrap = head(s);
      if (s.lead) wrap.appendChild(anim(el("p", "lead", s.lead), 4));
      const ul = anim(el("ul", "blist"), 5);
      (s.items || []).forEach((it) => {
        const li = el("li");
        if (it.label) li.appendChild(el("span", "bl-label", it.label));
        const b = el("div", "bl-body");
        b.appendChild(el("div", "bl-main", it.main || ""));
        if (it.sub) b.appendChild(el("div", "bl-sub", it.sub));
        li.appendChild(b);
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
      return wrap;
    },

    // 登壇者の紹介（写真なし。時間・区分・所属・演題をカードで）
    speakerIntro(s) {
      const wrap = head(s);
      const grid = anim(el("div", "sp-grid"), 4);
      (s.speakers || []).forEach((sp) => {
        const c = el("div", "sp-card");
        c.appendChild(el("div", "sp-top", `<span class="sp-time">${sp.time || ""}</span><span class="sp-label">${sp.label || ""}</span>`));
        c.appendChild(el("div", "sp-org", sp.org || ""));
        if (sp.name) c.appendChild(el("div", "sp-name", sp.name));
        if (sp.theme) c.appendChild(el("div", "sp-theme", sp.theme));
        grid.appendChild(c);
      });
      wrap.appendChild(grid);
      return wrap;
    },

    // 語りかける文章（問いかけ＋数行）— 公式サイトの About 文を見せる
    poem(s) {
      const wrap = head(s);
      const p = anim(el("div", "poem"), 4);
      if (s.question) p.appendChild(el("span", "q", s.question));
      (s.lines || []).forEach((t) => p.appendChild(el("div", null, t)));
      wrap.appendChild(p);
      return wrap;
    },

    history(s) {
      const wrap = head(s);
      const grid = anim(el("div", "history-grid" + ((s.events || []).length >= 3 ? " cols-3" : "")), 4);
      s.events.forEach((ev) => {
        const card = el("div", "event-card");
        if (ev.draft) card.appendChild(draftBadge());
        const ecph = photo(ev.image, "ec-photo", "PHOTO");
        if (ev.image && ecph.tagName === "IMG") {
          if (ev.imgFit === "contain") ecph.classList.add("fit-contain");
          if (ev.imgPos) ecph.style.objectPosition = ev.imgPos;
        }
        card.appendChild(ecph);
        const body = el("div", "ec-body");
        if (ev.edition) body.appendChild(el("span", "ec-edition font-tech", ev.edition));
        body.appendChild(el("div", "ec-title font-fude",
          ev.title ? ev.title.replace("×", '<span class="x">×</span>') : ""));
        if (ev.desc) body.appendChild(el("p", "ec-desc", ev.desc));
        card.appendChild(body);
        grid.appendChild(card);
      });
      wrap.appendChild(grid);
      return wrap;
    },

    theme(s) {
      const wrap = head(s);
      if (s.lead) wrap.appendChild(anim(el("p", "lead", s.lead), 4));
      const ul = anim(el("ul", "idea-list"), 5); ul.style.marginTop = "26px";
      (s.ideas || []).forEach((t, i) => {
        const li = el("li", null, t); li.setAttribute("data-no", "0" + (i + 1));
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
      return wrap;
    },

    research(s) {
      const wrap = head(s);
      if (s.lead) wrap.appendChild(anim(el("p", "lead", s.lead), 4));
      const grid = anim(el("div", "grid grid-3 research-grid"), 5); grid.style.marginTop = "24px";
      const bars = ["var(--kaga-enji)", "var(--kaga-ai)", "var(--kaga-kusa)"];
      (s.steps || []).forEach((st, i) => {
        const card = el("div", "card");
        const bar = el("div", "card-bar"); bar.style.background = bars[i % bars.length]; card.appendChild(bar);
        if (st.no) card.appendChild(el("span", "tag", st.no));
        card.appendChild(el("h3", null, st.title || ""));
        if (st.desc) card.appendChild(el("p", null, st.desc));
        grid.appendChild(card);
      });
      wrap.appendChild(grid);
      if (s.keywords && s.keywords.length) {
        const kw = anim(el("div"), 6);
        kw.style.cssText = "margin-top:24px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;";
        kw.appendChild(el("span", "tag", "KEYWORD"));
        s.keywords.forEach((k) => {
          const t = el("span", null, k);
          t.style.cssText = "font-family:'Shippori Mincho',serif; font-weight:700; font-size:31px; color:var(--kaga-enji); border-bottom:3px solid var(--kaga-oudo); padding:1px 5px;";
          kw.appendChild(t);
        });
        wrap.appendChild(kw);
      }
      return wrap;
    },

    // 登壇者：画像＋タイトルのみ（左＝大きな見出し／右＝大きな写真）を中央に配置
    input(s) {
      const wrap = el("div", "slide input-slide");
      if (s.draft) wrap.appendChild(draftBadge());
      const row = el("div", "input2");
      // 左：見出し
      const left = anim(el("div", "input2-left"), 1);
      if (s.kicker) {
        const k = el("div", "kicker");
        k.innerHTML = `<span class="en">${s.kicker}</span>` + (s.kickerJa ? `<span>${s.kickerJa}</span>` : "");
        left.appendChild(k);
      }
      if (s.title) left.appendChild(el("h2", "slide-title input-title", s.title));
      left.appendChild(el("div", "title-rule"));
      row.appendChild(left);
      // noPhoto: true … 右のカードは出さず、タイトルの下に所属と名前を並べる（2026-10-26）
      if (s.noPhoto) {
        wrap.classList.add("input-plain");
        const who = el("div", "speaker-line");
        if (s.role) who.appendChild(el("div", "sl-org", s.role));
        if (s.speaker) who.appendChild(el("div", "sl-name", s.speaker));
        left.appendChild(who);
        wrap.appendChild(row);
        return wrap;
      }
      // 右：登壇者写真＋氏名
      const card = anim(el("div", "card guest input-photo"), 2);
      card.appendChild(photo(s.image, "photo", "SPEAKER"));
      if (s.speaker) card.appendChild(el("div", "g-name", s.speaker));
      if (s.role) card.appendChild(el("div", "g-role", s.role));
      row.appendChild(card);
      wrap.appendChild(row);
      return wrap;
    },

    guests(s) {
      const wrap = head(s);
      if (s.note) wrap.appendChild(anim(noteLine(s.note), 4));
      const cols = (s.guests && s.guests.length >= 4) ? "grid-4" : "grid-3";
      const grid = anim(el("div", "grid " + cols), 5); grid.style.marginTop = "20px";
      (s.guests || []).forEach((g) => {
        const card = el("div", "card guest");
        const ph = photo(g.image, "photo", "PHOTO");
        if (g.image && ph.tagName === "IMG" && g.fit === "contain") ph.classList.add("fit-contain");
        card.appendChild(ph);
        card.appendChild(el("div", "g-name", g.name || ""));
        if (g.role) card.appendChild(el("div", "g-role", g.role));
        if (g.org)  card.appendChild(el("div", "g-org", g.org));
        grid.appendChild(card);
      });
      wrap.appendChild(grid);
      return wrap;
    },

    criteria(s) {
      const wrap = head(s);
      if (s.note) wrap.appendChild(anim(noteLine(s.note), 4));
      const box = anim(el("div", "criteria"), 5); box.style.marginTop = "16px";
      if ((s.items || []).some((it) => it.tag)) box.classList.add("has-tags");   // 札付き＝右下ロゴと重ならない幅に
      (s.items || []).forEach((it, i) => {
        const row = el("div", "criteria-row");
        row.appendChild(el("div", "c-no font-tech", "0" + (i + 1)));
        const mid = el("div");
        mid.appendChild(el("div", "c-name", it.name || ""));
        if (it.desc) mid.appendChild(el("div", "c-desc", it.desc));
        row.appendChild(mid);
        if (it.tag) row.appendChild(el("div", "c-tag" + (it.tagAlt ? " is-alt" : ""), it.tag));   // 決まり方の札
        else row.appendChild(el("div", "c-weight font-tech", it.weight ? it.weight : ""));
        box.appendChild(row);
      });
      wrap.appendChild(box);
      return wrap;
    },

    schedule(s) {
      const wrap = head(s);
      if (s.dayLabel) wrap.appendChild(anim(el("div", "tt-day-pill", s.dayLabel), 4));
      const tt = anim(el("div", "timetable"), 5);
      (s.rows || []).forEach((r) => {
        const row = el("div", "tt-row" + (r.now ? " is-now" : "") + (r.brk ? " is-break" : ""));
        row.appendChild(el("div", "tt-time", r.time || ""));
        const body = el("div", "tt-body");
        body.appendChild(el("div", "tt-title", r.title || ""));
        if (r.desc) body.appendChild(el("div", "tt-desc", r.desc));
        row.appendChild(body);
        tt.appendChild(row);
      });
      wrap.appendChild(tt);
      return wrap;
    },

    // 第一幕 → 開発期間(矢羽根) → 第二幕 の3パネル・フロー
    flow(s) {
      const wrap = head(s);
      const row = anim(el("div", "flow"), 4);

      (s.phases || []).forEach((p) => {
        let host, mount;
        if (p.shape === "chevron") {
          host  = el("div", "flow-chevron-wrap");
          const ch = el("div", "flow-chevron");
          mount = el("div", "inner");
          ch.appendChild(mount);
          host.appendChild(ch);
        } else {
          host  = el("div", "card flow-card");
          mount = host;
        }
        const bar = el("div", "card-bar");
        bar.style.background = p.bar || "var(--kaga-enji)";
        mount.appendChild(bar);
        if (p.label) mount.appendChild(el("div", "flow-label", p.label));
        if (p.title) {
          mount.appendChild(el("h3", null,
            p.title + (p.date ? ` <span class="font-tech" style="font-size:22px;color:var(--kaga-ai)">${p.date}</span>` : "")));
        }
        if (p.desc) mount.appendChild(el("p", null, p.desc));
        row.appendChild(host);
      });

      wrap.appendChild(row);
      return wrap;
    },

    // 案内スライド（バナー＋ラベル付きの項目リスト。s.image があれば右に画像を並べる）
    notice(s) {
      const wrap = head(s);
      if (s.compact) wrap.classList.add("notice-compact");   // ラベル1行・文字ひと回り小さく
      if (s.qr) wrap.classList.add("no-corner");             // QRと重ならないよう右下の常駐ロゴを隠す
      if (s.banner) wrap.appendChild(anim(el("div", "notice-banner", s.banner), 4));
      const list = el("div", "notice-list");
      (s.blocks || []).forEach((bl) => {
        const row = el("div", "notice-row");
        row.appendChild(el("div", "notice-label", bl.label || ""));
        const body = el("div", "notice-body");
        (bl.items || []).forEach((it) => body.appendChild(el("div", "notice-item", it)));
        if (bl.note) body.appendChild(el("div", "notice-sub", "※ " + bl.note));
        row.appendChild(body);
        list.appendChild(row);
      });
      if (s.image || s.qr) {
        const cols = anim(el("div", "notice-cols" + (s.figWide ? " fig-wide" : "")), 5);
        cols.appendChild(list);
        const fig = el("figure", "notice-fig" + (s.qr ? " has-qr" : ""));
        if (s.image) {
          const im = el("div", "notice-imgwrap");
          im.appendChild(photo(s.image, "notice-img", "IMAGE"));
          if (s.imageCaption) im.appendChild(el("figcaption", null, s.imageCaption));
          fig.appendChild(im);
        }
        if (s.qr) {                                   // QRコード（白地の枠＋下にラベル）
          const q = el("div", "notice-qr" + (s.image ? "" : " is-large"));
          const qi = el("img"); qi.src = s.qr; qi.alt = s.qrLabel || "QRコード";
          q.appendChild(qi);
          if (s.qrLabel) q.appendChild(el("div", "notice-qr-label", s.qrLabel));
          fig.appendChild(q);
        }
        cols.appendChild(fig);
        wrap.appendChild(cols);
      } else {
        wrap.appendChild(anim(list, 5));
      }
      return wrap;
    },

    closing(s) {
      const wrap = el("div", "slide closing");
      wrap.appendChild(anim(el("div", "big-fude", s.fude || "いざ、醸さん！"), 1));
      if (s.sub) wrap.appendChild(anim(el("div", "closing-sub", s.sub), 2));
      return wrap;
    },

    // 区切り（中央に単語だけ）
    section(s) {
      const wrap = el("div", "slide section");
      wrap.appendChild(anim(el("div", "section-title", s.title || s.text || ""), 1));
      if (s.sub) wrap.appendChild(anim(el("div", "section-sub font-tech", s.sub), 2));
      return wrap;
    },

    // 休憩・待機（大きな時刻表示）— Day2用
    brk(s) {
      const wrap = el("div", "slide section");
      if (s.draft) wrap.appendChild(draftBadge());
      wrap.appendChild(anim(el("div", "section-title", s.title || "休憩"), 1));
      if (s.resume) {
        const t = anim(el("div", "font-tech"), 2);
        t.style.cssText = "margin-top:26px; font-size:96px; font-weight:700; letter-spacing:.06em; color:var(--kaga-ai); text-shadow:5px 5px 0 var(--kaga-oudo);";
        t.innerHTML = s.resume;
        wrap.appendChild(t);
      }
      if (s.sub) {
        const n = anim(el("div", "section-sub"), 3);
        n.style.cssText = "margin-top:22px; font-size:28px; letter-spacing:.08em; color:#4b4436;";
        n.innerHTML = s.sub;
        wrap.appendChild(n);
      }
      return wrap;
    },

    // 表彰（賞名 → 受賞チーム名）— Day2用
    award(s) {
      const wrap = el("div", "slide award");
      wrap.style.cssText = "display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;";
      if (s.draft) wrap.appendChild(draftBadge());

      // 賞名が長い（英語名など）ときは自動で字を小さくする
      const plainLen = (s.award || "").replace(/<[^>]+>/g, "").length;
      const nameSize = plainLen <= 10 ? 88 : (plainLen <= 18 ? 64 : 48);
      const name = anim(el("div", "font-fude"), 2);
      name.style.cssText = "margin-top:14px; font-size:" + nameSize + "px; line-height:1.18; color:var(--kaga-enji); letter-spacing:.06em; text-shadow:5px 5px 0 var(--kaga-oudo);";
      name.innerHTML = s.award || "";
      wrap.appendChild(name);

      if (s.reading) {
        const rd = anim(el("div", "font-tech"), 2);
        rd.style.cssText = "margin-top:8px; font-size:24px; letter-spacing:.12em; color:var(--kaga-ai);";
        rd.innerHTML = s.reading;
        wrap.appendChild(rd);
      }

      if (s.desc) {
        const d = anim(el("p"), 3);
        d.style.cssText = "margin-top:16px; font-size:26px; color:#4b4436; max-width:1180px;";
        d.innerHTML = s.desc;
        wrap.appendChild(d);
      }

      // 入場アニメ(data-anim)は外側の枠に付ける。箱自体に付けると、Dキーの揺れ・ポップの
      // アニメで入場アニメが上書きされ、初期値の opacity:0 に戻って箱ごと消えてしまうため
      const holder = anim(el("div", "award-holder"), 4);
      const box = el("div", "award-box");
      box.style.cssText = "position:relative; margin-top:30px; padding:22px 64px; background:#fff; border-width:5px; border-style:solid; box-shadow:10px 10px 0 rgba(35,73,120,.18); min-width:620px;";
      const lbl = el("div", "font-tech award-label", s.teamLabel || "WINNER");
      lbl.style.cssText = "font-size:20px; letter-spacing:.3em; color:var(--kaga-ai);";
      box.appendChild(lbl);
      // 受賞チーム名は画面に一切出さず、D キー3回目で初めて差し込む
      // （誤ってページ送りしても名前が見えないように、DOM上は常に伏せ字）
      const team = el("div", "font-fude award-team");
      team.style.cssText = "margin-top:8px; font-size:56px;";   // 色・字間は style.css（状態ごとに変えるため）
      team.textContent = MASK;
      box.appendChild(team);
      holder.appendChild(box);
      // 受賞チームの発表資料1ページ目を出す枠。場所だけ先に確保しておき（発表の瞬間にレイアウトが跳ねない）、
      // 画像そのものは D キー3回目で初めて差し込む（伏せ字と同じく、事前には DOM に入れない）
      if (typeof PITCH_TEAMS !== "undefined" && PITCH_TEAMS.length) {
        holder.appendChild(el("div", "award-shot"));
        wrap.classList.add("has-shot");
      }
      wrap.appendChild(holder);
      wrap.classList.add("has-reveal");
      if (s.plain) wrap.classList.add("award-plain");   // 枠・WINNER・伏せ字なし（名前の文字だけ出す）
      wrap._teamName = s.team || "";
      return wrap;
    },

    // イベント告知（ポスター風）：見出し → 中央に画像 → キャッチ → 日程カード＋QR
    event(s) {
      // イベント告知：見出し → 画像（大）＋右にQR → キャッチ → 細い日程カード
      const wrap = head(s);
      if (s.qr) wrap.classList.add("no-corner");             // QRと重ならないよう右下の常駐ロゴを隠す
      const top = anim(el("div", "ev-top"), 4);
      if (s.image) top.appendChild(photo(s.image, "ev-photo", "IMAGE"));
      if (s.qr) {
        const q = el("div", "notice-qr ev-qr");
        const qi = el("img"); qi.src = s.qr; qi.alt = s.qrLabel || "QRコード";
        q.appendChild(qi);
        if (s.qrLabel) q.appendChild(el("div", "notice-qr-label", s.qrLabel));
        top.appendChild(q);
      }
      wrap.appendChild(top);
      if (s.catch) wrap.appendChild(anim(el("div", "ev-catch", s.catch), 5));
      const row = anim(el("div", "ev-row"), 6);
      (s.days || []).forEach((d) => {
        const c = el("div", "ev-day");
        c.appendChild(el("div", "ev-day-label", d.label || ""));
        const b = el("div", "ev-day-body");
        b.appendChild(el("span", "ev-day-date", d.date || ""));
        if (d.place) b.appendChild(el("span", "ev-day-place", d.place));
        c.appendChild(b);
        row.appendChild(c);
      });
      wrap.appendChild(row);
      return wrap;
    },

    // ピッチ：チームの呼び込み（発表順・チーム名・作品名・次のチーム）— Day2用
    pitch(s) {
      const wrap = el("div", "slide pitch");
      // エントリーナンバーの帯は出さない（2026-09-26 オーナー指示）
      const len = (s.name || "").length;
      const nm = anim(el("div", "pitch-name font-fude"), 2);
      nm.style.fontSize = (len <= 8 ? 120 : (len <= 12 ? 88 : (len <= 16 ? 72 : 56))) + "px";   // 長いチーム名は小さく（1行に収める）
      nm.textContent = s.name || "";
      wrap.appendChild(nm);
      if (s.title) wrap.appendChild(anim(el("div", "pitch-title", "『" + s.title + "』"), 3));
      if (!s.hasPages) wrap.appendChild(anim(el("div", "pitch-nodata", "※ 発表資料は未取り込みです"), 5));
      return wrap;
    },

    // ピッチ：発表資料（PDFのページ画像を全面に表示）— Day2用
    pdfpage(s) {
      const wrap = el("div", "slide pdfpage");
      const img = el("img", "pdfpage-img");
      img.src = s.src; img.alt = (s.name || "") + " 発表資料 " + s.page + "ページ";
      img.decoding = "async";            // 先に全ページ読み込んでおく（lazy にすると表示直後に一瞬白くなる）
      wrap.appendChild(img);
      return wrap;
    },
  };

  function pad2(n) { return String(n).padStart(2, "0"); }

  /* ---------- 「pitchTeams」1枚を、発表順の［呼び込み＋資料ページ］に展開 ----------
   *  データは js/pitch-data-day2.js（build_pitch_day2.py が公式サイトから自動生成） */
  function expandPitch(slides) {
    const out = [];
    slides.forEach((s) => {
      if (s.type !== "pitchTeams") { out.push(s); return; }
      const teams = (typeof PITCH_TEAMS !== "undefined") ? PITCH_TEAMS : [];
      teams.forEach((t, i) => {
        const pages = t.pages || [];
        out.push({ type: "pitch", no: t.no, total: teams.length, name: t.name, title: t.title,
                   hasPages: pages.length > 0 });
        pages.forEach((src, p) => out.push({ type: "pdfpage", src: src, page: p + 1, name: t.name }));
      });
    });
    return out;
  }

  /* ---------- 見出し（kicker + title + rule）共通 ---------- */
  function head(s) {
    const wrap = el("div", "slide");
    if (s.draft) wrap.appendChild(draftBadge());
    if (s.kicker) {
      const k = el("div", "kicker");
      k.innerHTML = `<span class="en">${s.kicker}</span>` + (s.kickerJa ? `<span>${s.kickerJa}</span>` : "");
      wrap.appendChild(anim(k, 1));
    }
    if (s.title) wrap.appendChild(anim(el("h2", "slide-title", s.title), 2));
    wrap.appendChild(anim(el("div", "title-rule"), 3));
    return wrap;
  }
  function noteLine(text) {
    const n = el("p", "lead", "※ " + text);
    n.style.fontSize = "19px"; n.style.color = "#6e6450";
    return n;
  }
  // 画像 or プレースホルダ
  function photo(src, cls, label) {
    if (src) { const i = el("img", cls); i.src = src; i.alt = ""; return i; }
    const ph = el("div", cls + " placeholder", label || "PHOTO");
    return ph;
  }

  /* =====================================================================
   *  ビルド：データ → DOM
   * ===================================================================== */
  const slidesRoot = $("#slides");
  const built = [];
  // hidden: true のスライドは表示しない（データは残す＝false にすれば復活）
  expandPitch(D.slides.filter((s) => !s.hidden)).forEach((s) => {
    const fn = renderers[s.type];
    const node = fn ? fn(s) : el("div", "slide", '<p class="lead">未対応のスライド種別: ' + s.type + "</p>");
    // 中身を .slide-content にまとめる（縦はみ出し時に自動縮小するため）
    // ※ DRAFTバッジはスライド直下に残す（縮小の対象外）
    const content = el("div", "slide-content");
    Array.from(node.childNodes).forEach((ch) => {
      if (ch.nodeType === 1 && (ch.classList.contains("draft-badge") || ch.classList.contains("variant-badge"))) return;
      content.appendChild(ch);
    });
    node.appendChild(content);
    if (s.variant) node.appendChild(el("div", "variant-badge", s.variant));   // 「案A：写真版」など
    node._peek = !!s.peek;
    slidesRoot.appendChild(node);
    built.push(node);
  });

  // 常駐グリッチロゴ（右下）
  if (D.meta.showCornerLogo) {
    const cl = el("div", "corner-logo");
    cl.appendChild(glitchLogo(LOGO));
    $("#stage").appendChild(cl);
  }

  /* ---------- 泳ぐ魚（背景）：公式特設サイトの .fish-layer と同じ9匹・同じ速さ ----------
   *  [画像, 上からの位置%, 幅px, 濃さ, 横切る秒数, 開始の遅れ秒, 逆向き]（サイトの index.html の値そのまま） */
  (function buildFish() {
    const layer = $(".fish-layer"); if (!layer) return;
    const school = [
      ["fish1.png",  7, 210, .20, 29,  -8, false],
      ["fish2.png", 16, 260, .16, 37, -25, true ],
      ["fish3.png", 27, 175, .15, 24, -17, false],
      ["fish4.png", 38, 230, .14, 34,  -9, true ],
      ["fish5.png", 50, 185, .17, 27, -22, false],
      ["fish6.png", 60, 210, .14, 41, -31, true ],
      ["fish7.png", 69, 200, .15, 33, -14, false],
      ["fish8.png", 78, 245, .14, 31,  -6, true ],
      ["fish9.png", 88, 190, .16, 36, -28, false],
    ];
    school.forEach((f) => {
      const im = el("img", "fish" + (f[6] ? " reverse" : ""));
      im.src = "images/" + f[0]; im.alt = "";
      im.style.cssText = "--top:" + f[1] + "%;--width:" + f[2] + "px;--opacity:" + f[3] +
                         ";--speed:" + f[4] + "s;--delay:" + f[5] + "s";
      layer.appendChild(im);
    });
  })();

  /* ---------- のぞく魚：サイトの表紙（splash）と同じ。画面のふちから大きな魚が顔を出す ----------
   *  表示するのは peek: true のスライド（待機・表紙・結び）だけ。数秒おきに1匹ずつ自動でのぞく。
   *  [画像, 出てくる辺, 大きさpx, ふちからの位置px, 辺に沿った位置%] */
  const peekFish = (function () {
    const layer = $(".peek-layer"); if (!layer) return [];
    const list = [
      ["fish1.png", "left",   250, -178,  3],
      ["fish2.png", "top",    270, -194, 16],
      ["fish3.png", "left",   300, -220, 36],
      ["fish4.png", "top",    250, -176, 43],
      ["fish5.png", "right",  260, -187, 72],
      ["fish6.png", "right",  300, -218, 38],
      ["fish7.png", "right",  280, -198,  3],
      ["fish8.png", "bottom", 280, -202, 43],
      ["fish9.png", "left",   260, -185, 73],
    ];
    return list.map((f) => {
      const b = el("div", "peek-fish peek-" + f[1]);
      b.style.cssText = "--size:" + f[2] + "px;--edge:" + f[3] + "px;--along:" + f[4] + "%";
      const im = el("img"); im.src = "images/" + f[0]; im.alt = "";
      b.appendChild(im);
      layer.appendChild(b);
      return b;
    });
  })();
  function nudgeFish(fish) {
    fish.classList.remove("is-peeking"); void fish.offsetWidth; fish.classList.add("is-peeking");
    clearTimeout(fish.peekTimer);
    fish.peekTimer = setTimeout(() => fish.classList.remove("is-peeking"), 1400);
  }
  let peekOrder = 0;
  setInterval(() => {
    if (!peekFish.length || !$("#stage").classList.contains("show-peek")) return;
    peekOrder = (peekOrder + 3 + Math.floor(Math.random() * 3)) % peekFish.length;   // 毎回ちがう辺から
    nudgeFish(peekFish[peekOrder]);
  }, 1700);

  /* ---------- 金沢 → 豊洲 の行列（画面下）：サイトはスクロール量、こちらはスライドの進み具合で進む ----------
   *  新幹線は行列より先に豊洲へ着く（サイトと同じ 1.28 倍）。進んでいる間だけ人がてくてく揺れる */
  let walkTimer = null;
  function moveProcession() {
    const area = $(".procession-area"); if (!area) return;
    const p = total > 1 ? idx / (total - 1) : 0;
    const train = $(".train", area), proc = $(".procession", area);
    const w = area.clientWidth;
    if (train) train.style.left = (Math.min(1, p * 1.28) * Math.max(0, w - train.offsetWidth)) + "px";
    if (proc)  proc.style.left  = (p * Math.max(0, w - proc.offsetWidth)) + "px";
    area.classList.add("is-moving");
    clearTimeout(walkTimer);
    walkTimer = setTimeout(() => area.classList.remove("is-moving"), 1600);
  }

  /* =====================================================================
   *  ナビゲーション
   * ===================================================================== */
  const total = built.length;
  let idx = 0;

  const progress = $(".progress");
  const pagerCur = $(".pager .cur");
  const pagerTot = $(".pager .tot");
  const dotsWrap = $(".dots");

  // ドット生成（資料ページは点を出さない＝100枚超でも並びきる。資料中はそのチームの点が光る）
  const dotOf = [];
  let lastDot = 0;
  built.forEach((s, i) => {
    const d = el("button", "dot");
    d.addEventListener("click", () => go(i));
    if (s.classList.contains("pdfpage")) d.style.display = "none"; else lastDot = i;
    if (s.classList.contains("pitch")) d.classList.add("dot-pitch");
    dotOf[i] = lastDot;
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);
  pagerTot.textContent = String(total).padStart(2, "0");

  /* =====================================================================
   *  表彰スライドの発表演出（ドラムロール → ばん！）
   * ---------------------------------------------------------------------
   *  操作：D キー、または受賞チームの枠をクリック
   *    1回目 … ドラムロール開始（鳴らしたままタメる）
   *    2回目 … シンバル＋フラッシュ（チーム名はまだ伏せたまま）
   *    3回目 … チーム名がばんと出る（紙吹雪）
   *    4回目 … 元に戻す（リハーサル用）
   *  スライドを移動すると自動で元に戻る（名前は伏せ字に戻る）。
   *  音源は audio/ に同梱（パブリックドメイン。audio/CREDITS.md 参照）
   * ===================================================================== */
  const reveal = (function () {
    const roll = new Audio("audio/drumroll.mp3"); roll.loop = true; roll.volume = 0.9;
    const hit  = new Audio("audio/reveal.mp3");   hit.volume  = 1.0;
    let fadeTimer = null;

    const play = (a) => { try { const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} };

    function stopRoll() {
      clearInterval(fadeTimer);
      let v = roll.volume;
      fadeTimer = setInterval(() => {                 // 80msでスッと消す（ブツ切りにしない）
        v -= 0.15;
        if (v <= 0) { clearInterval(fadeTimer); roll.pause(); roll.currentTime = 0; roll.volume = 0.9; }
        else { try { roll.volume = v; } catch (e) {} }
      }, 12);
    }

    function flash(slide) {
      const f = el("div", "award-flash");
      slide.appendChild(f);
      setTimeout(() => f.remove(), 700);
    }

    function confetti(slide) {
      const colors = ["var(--kaga-enji)", "var(--kaga-ai)", "var(--kaga-oudo)", "var(--kaga-kusa)", "var(--kaga-murasaki)"];
      const layer = el("div", "award-confetti");
      for (let i = 0; i < 48; i++) {
        const p = el("i");
        p.style.left = (Math.random() * 100) + "%";
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = (Math.random() * 0.35) + "s";
        p.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
        p.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
        layer.appendChild(p);
      }
      slide.appendChild(layer);
      setTimeout(() => layer.remove(), 3600);
    }

    // チーム名 → 発表資料の1ページ目（前後の空白・全角半角スペースの違いは無視して照合）
    function firstPageOf(name) {
      const norm = (x) => String(x || "").replace(/[\s　]+/g, "");
      const teams = (typeof PITCH_TEAMS !== "undefined") ? PITCH_TEAMS : [];
      const t = teams.filter((t) => norm(t.name) === norm(name))[0];
      return (t && t.pages && t.pages[0]) || "";
    }

    function reset(slide) {
      if (!slide) return;
      slide.classList.remove("is-rolling", "is-hit", "is-revealed", "is-empty");
      const t = slide.querySelector(".award-team");
      if (t) { t.textContent = MASK; t.style.fontSize = "56px"; }
      const sh = slide.querySelector(".award-shot");
      if (sh) sh.innerHTML = "";
      slide.querySelectorAll(".award-flash, .award-confetti").forEach((n) => n.remove());
    }

    function resetAll() { stopRoll(); hit.pause(); hit.currentTime = 0; built.forEach(reset); }

    function advance(slide) {
      if (!slide || !slide.classList.contains("has-reveal")) return;
      const team = slide.querySelector(".award-team");
      const cl = slide.classList;
      if (cl.contains("is-revealed")) {                       // 4回目 → 元に戻す
        reset(slide); return;
      }
      if (cl.contains("is-hit")) {                            // 3回目 → チーム名がばん
        cl.remove("is-hit"); cl.add("is-revealed");
        const name = (slide._teamName || "").trim();
        if (!name) cl.add("is-empty");
        if (team) {
          team.textContent = name || "（チーム名が未入力です）";
          // 長いチーム名（例：DXクエストアルムナイ_業務サポートチーム）は字を小さくして1行に収める
          const len = name.length;
          if (name) team.style.fontSize = (len <= 12 ? 56 : (len <= 18 ? 44 : 36)) + "px";
        }
        const shot = slide.querySelector(".award-shot");
        const src = name ? firstPageOf(name) : "";
        if (shot && src) {
          const im = el("img", "award-shot-img");
          im.src = src; im.alt = name + " 発表資料 1ページ目";
          shot.appendChild(im);
        }
        if (name) confetti(slide);
        fitSlide(slide);
        return;
      }
      if (cl.contains("is-rolling")) {                        // 2回目 → シンバル
        stopRoll();
        cl.remove("is-rolling"); cl.add("is-hit");
        hit.currentTime = 0; play(hit); flash(slide);
        return;
      }
      cl.add("is-rolling");                                   // 1回目 → ドラムロール
      roll.currentTime = 0; roll.volume = 0.9; play(roll);
    }

    // 受賞チームの枠をクリックしても進む（キーが押しにくい環境用）
    built.forEach((slide) => {
      const box = slide.querySelector(".award-box");
      if (box) box.addEventListener("click", (e) => { e.stopPropagation(); advance(slide); });
    });

    return { advance, resetAll, current: () => built[idx] };
  })();

  function go(n) {
    idx = Math.max(0, Math.min(total - 1, n));
    reveal.resetAll();                       // スライドを移ると発表演出は初期状態に戻す
    built.forEach((s, i) => s.classList.toggle("is-active", i === idx));
    dots.forEach((d, i) => d.classList.toggle("active", i === dotOf[idx]));
    // 資料ページ表示中は、ロゴ・ページ番号・操作ヒントなどを隠して資料だけを見せる
    $("#stage").classList.toggle("is-fullbleed", built[idx].classList.contains("pdfpage"));
    $("#stage").classList.toggle("hide-corner", built[idx].classList.contains("no-corner"));
    progress.style.width = ((idx + 1) / total * 100) + "%";
    pagerCur.textContent = String(idx + 1).padStart(2, "0");
    location.hash = "s" + (idx + 1);
    $("#stage").classList.toggle("show-peek", !!built[idx]._peek);
    moveProcession();
    fitSlide(built[idx]);
  }
  const next = () => go(idx + 1);
  const prev = () => go(idx - 1);

  /* ---------- キーボード ---------- */
  document.addEventListener("keydown", (e) => {
    // 編集パネルで文字を打っている間は、スライド操作（Space・D・数字など）を効かせない
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
    switch (e.key) {
      case "ArrowRight": case "PageDown": case " ": case "Enter":
        e.preventDefault(); next(); break;
      case "ArrowLeft": case "PageUp":
        e.preventDefault(); prev(); break;
      case "Home": go(0); break;
      case "End":  go(total - 1); break;
      case "f": case "F": toggleFs(); break;
      case "d": case "D":                      // 表彰：ドラムロール → 発表 → 戻す
        e.preventDefault(); reveal.advance(built[idx]); break;
      default:
        if (e.key >= "1" && e.key <= "9") go(parseInt(e.key, 10) - 1);
    }
  });

  /* ---------- クリック（左右ゾーン）＆矢印 ---------- */
  $(".nav-next").addEventListener("click", next);
  $(".nav-prev").addEventListener("click", prev);

  /* ---------- フルスクリーン ---------- */
  function toggleFs() {
    if (!document.fullscreenElement) {
      const req = document.documentElement.requestFullscreen
        || document.documentElement.webkitRequestFullscreen;
      if (req) { try { const p = req.call(document.documentElement); if (p && p.catch) p.catch(()=>{}); } catch(e){} }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { try { exit.call(document); } catch(e){} }
    }
  }
  document.addEventListener("fullscreenchange", () => {
    document.body.classList.toggle("is-fs", !!document.fullscreenElement);
    fitStage();
  });

  /* =====================================================================
   *  ステージを画面サイズにフィット（16:9 を縮小拡大）
   * ===================================================================== */
  function fitStage() {
    const stage = $("#stage");
    const pad = document.body.classList.contains("is-fs") ? 0 : 24;
    const sw = (window.innerWidth - pad * 2) / stage.offsetWidth;
    const sh = (window.innerHeight - pad * 2) / stage.offsetHeight;
    const scale = Math.min(sw, sh);
    stage.style.transform = "scale(" + scale + ")";
  }

  /* ---------- 各スライドのオートフィット（縦/横はみ出しを防止） ----------
   * 中身(.slide-content)がスライド枠を超えたら、その分だけ縮小する。
   * → 後から文章を増やしても絶対に見切れない。 */
  function fitSlide(slide) {
    if (!slide) return;
    const content = slide.querySelector(".slide-content");
    if (!content) return;
    content.style.transform = "none"; // いったん等倍に戻して実寸を測る
    const cs = getComputedStyle(slide);
    const availH = slide.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
    const availW = slide.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = content.scrollHeight, w = content.scrollWidth;
    let scale = 1;
    if (h > availH) scale = Math.min(scale, availH / h);
    if (w > availW) scale = Math.min(scale, availW / w);
    content.style.transformOrigin = "center center";
    content.style.transform = scale < 0.999 ? "scale(" + scale + ")" : "none";
  }
  function fitAll() { built.forEach(fitSlide); }

  window.addEventListener("resize", function () { fitStage(); fitAll(); moveProcession(); });
  window.addEventListener("load", fitAll);
  // Webフォント読み込み後・画像読み込み後にレイアウトが変わるので再フィット
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  Array.from(document.images).forEach(function (im) {
    if (!im.complete) im.addEventListener("load", function () { fitSlide(built[idx]); fitAll(); }, { once: true });
  });

  /* ---------- 起動 ---------- */
  const startHash = parseInt((location.hash.match(/^#s(\d+)$/) || [])[1], 10);
  go(isNaN(startHash) ? 0 : startHash - 1);
  fitStage();
})();

</script>
<script>
/* =====================================================================
 *  かんたん編集パネル（任意機能）
 *  - 画面左上「✎ 編集」から開く
 *  - いちばん上の「🏆 受賞チームを選択」で、表彰スライドの受賞チームをプルダウンでまとめて選べる
 *  - 文字の修正／スライドの並べ替え・複製・削除ができる
 *  - 「プレビューに反映」… 編集内容をこのブラウザに保存して表示（localStorage）
 *  - 「slides-data.js をDL」… 編集結果をファイルとして書き出し（差し替え用）
 *  - 「編集をリセット」… 保存した編集を消してファイルの内容に戻す
 *  ※ この機能は表示専用の補助。確定したらDLしたファイルで slides-data.js を置換推奨。
 * ===================================================================== */
(function () {
  "use strict";
  const LS = "fishDeckOverride";
  const LSV = LS.replace("Override", "Version");     // 版（単体版HTMLのみ DECK_VERSION が定義される）
  // 編集内容をこのブラウザに保存して、表示を作り直す（表示中のスライドはそのまま）
  function saveAndReload() {
    try {
      localStorage.setItem(LS, JSON.stringify(work));
      if (typeof DECK_VERSION !== "undefined") localStorage.setItem(LSV, DECK_VERSION);
    } catch (e) { alert("保存できませんでした（ブラウザの保存領域が使えない設定です）"); return; }
    location.reload();
  }
  function activeDeck() {
    try { const o = localStorage.getItem(LS); if (o) return JSON.parse(o); } catch (e) {}
    return (typeof DECK !== "undefined") ? DECK : { slides: [] };
  }
  let work = JSON.parse(JSON.stringify(activeDeck()));

  /* ---- スタイル（自己完結。style.css は触らない） ---- */
  const css = `
.editor-btn{position:fixed;top:12px;left:12px;z-index:99999;font-family:inherit;font-weight:700;font-size:14px;background:#1f3864;color:#fff;border:none;padding:8px 12px;cursor:pointer;border-radius:3px;opacity:.85}
.editor-btn:hover{opacity:1}
.is-fs .editor-btn,.is-fs .editor-panel{display:none!important}
.editor-panel{position:fixed;top:0;right:0;width:390px;max-width:94vw;height:100vh;overflow-y:auto;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.25);z-index:99999;transform:translateX(100%);transition:transform .25s;font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;font-size:13px;color:#222}
.editor-panel.show{transform:none}
.ed-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#1f3864;color:#fff;position:sticky;top:0;z-index:1}
.ed-x{background:none;border:none;color:#fff;font-size:22px;line-height:1;cursor:pointer}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid #ddd}
.ed-tools button{font-size:12px;padding:7px 9px;border:1px solid #bbb;background:#f3f3f3;cursor:pointer;border-radius:3px}
.ed-primary{background:#9d2b45!important;color:#fff;border-color:#9d2b45!important;font-weight:700}
.ed-note{padding:6px 12px;background:#fff7e6;color:#9d2b45;font-size:11px}
.ed-slide{border-bottom:1px solid #e5e5e5}
.ed-slide-h{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 12px;background:#f7f6f2;cursor:pointer}
.ed-idx{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-ctr{display:flex;gap:3px;flex:none}
.ed-ctr button{border:1px solid #bbb;background:#fff;cursor:pointer;font-size:11px;padding:3px 6px;border-radius:2px}
.ed-del{color:#c0392b}
.ed-body{padding:8px 12px 12px;display:none}
.ed-slide.open .ed-body{display:block}
.ed-field{display:flex;gap:8px;align-items:flex-start;margin:5px 0}
.ed-key{flex:0 0 96px;color:#777;font-size:11px;padding-top:5px;word-break:break-all}
.ed-field textarea,.ed-field input{flex:1;font-family:inherit;font-size:13px;padding:4px 6px;border:1px solid #ccc;border-radius:3px;resize:vertical}
.ed-check{align-items:center}
.ed-group{margin:8px 0;padding:6px 8px;border-left:3px solid #c69956;background:#faf9f6}
.ed-grpkey{font-weight:700;font-size:11px;color:#555;margin-bottom:4px}
.ed-subitem{margin:6px 0;padding:4px 8px;background:#fff;border:1px solid #eee}
.ed-subh{font-size:10px;color:#999;margin-bottom:2px}
.ed-teams{margin:10px 12px 14px;padding:12px 12px 14px;background:#fdf3f5;border:2px solid #9d2b45;border-radius:4px}
.ed-teams h4{margin:0 0 4px;font-size:15px;color:#9d2b45}
.ed-teams .ed-help{font-size:11px;color:#6e6450;margin-bottom:10px;line-height:1.5}
.ed-team{margin:10px 0}
.ed-team-award{font-weight:700;font-size:13px;margin-bottom:3px}
.ed-team input,.ed-team select{width:100%;box-sizing:border-box;font-size:17px;padding:8px 10px;border:2px solid #c9b8bd;border-radius:4px}
.ed-team input:focus,.ed-team select:focus{outline:none;border-color:#9d2b45}
.ed-team.is-set input,.ed-team.is-set select{border-color:#7a9e4a;background:#f5faef}
.ed-team-state{font-size:11px;margin-top:2px;color:#999}
.ed-team.is-set .ed-team-state{color:#5d7d35}
.ed-teams .ed-save{display:block;width:100%;margin-top:12px;padding:11px;font-size:15px;font-weight:700;background:#9d2b45;color:#fff;border:none;border-radius:4px;cursor:pointer}
.ed-sec{padding:8px 12px 4px;font-weight:700;font-size:12px;color:#555;border-top:1px solid #ddd}
`;
  const st = document.createElement("style"); st.id = "ed-style"; st.textContent = css; document.head.appendChild(st);

  function h(tag, cls, txt) { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }

  const btn = h("button", "editor-btn", "✎ 編集"); document.body.appendChild(btn);
  const panel = h("div", "editor-panel"); document.body.appendChild(panel);
  let open = false;
  btn.onclick = () => { open = !open; panel.classList.toggle("show", open); if (open) render(); };

  function strip(s) { return String(s).replace(/<[^>]+>/g, ""); }
  function label(s, i) {
    let t = s.title ? strip(s.title) : strip(s.award || s.text || s.fude || s.speaker || "");
    return (i + 1) + "．" + (s.type || "?") + (t ? " — " + t : "");
  }

  function render() {
    panel.innerHTML = "";
    const head = h("div", "ed-head"); head.appendChild(h("strong", null, "スライド編集"));
    const x = h("button", "ed-x", "×"); x.onclick = () => { open = false; panel.classList.remove("show"); };
    head.appendChild(x); panel.appendChild(head);

    teamSection();
    panel.appendChild(h("div", "ed-sec", "そのほかの編集（文章・並べ替えなど）"));

    const tools = h("div", "ed-tools");
    const apply = h("button", "ed-primary", "プレビューに反映");
    apply.onclick = saveAndReload;
    const dlHtml = h("button", "ed-primary", "この内容でHTMLを書き出し");
    dlHtml.onclick = exportHtml;
    const dl = h("button", null, "slides-data.js をDL"); dl.onclick = download;
    const reset = h("button", null, "編集をリセット");
    reset.onclick = () => { if (confirm("保存した編集を消して、ファイルの内容に戻します。よろしいですか？")) { localStorage.removeItem(LS); localStorage.removeItem(LSV); location.reload(); } };
    tools.append(apply, dlHtml, dl, reset); panel.appendChild(tools);
    panel.appendChild(h("div", "ed-note", "「書き出し」＝編集を反映した完成HTMLをDL。ダウンロードした同名ファイルで元のHTMLを上書き保存すれば確定します。"));
    if (localStorage.getItem(LS)) panel.appendChild(h("div", "ed-note", "※ いまは「編集中の内容」を表示しています（未反映の変更は『反映』で確定）"));

    work.slides.forEach((s, i) => {
      const block = h("div", "ed-slide");
      const sh = h("div", "ed-slide-h");
      const idx = h("span", "ed-idx", label(s, i));
      idx.onclick = () => block.classList.toggle("open");
      sh.appendChild(idx);
      const ctr = h("span", "ed-ctr");
      const up = h("button", null, "↑"); up.onclick = (e) => { e.stopPropagation(); move(i, -1); };
      const dn = h("button", null, "↓"); dn.onclick = (e) => { e.stopPropagation(); move(i, 1); };
      const dup = h("button", null, "複製"); dup.onclick = (e) => { e.stopPropagation(); work.slides.splice(i + 1, 0, JSON.parse(JSON.stringify(s))); render(); };
      const del = h("button", "ed-del", "削除"); del.onclick = (e) => { e.stopPropagation(); if (confirm("このスライドを削除しますか？")) { work.slides.splice(i, 1); render(); } };
      ctr.append(up, dn, dup, del); sh.appendChild(ctr); block.appendChild(sh);
      const body = h("div", "ed-body"); buildFields(s, body); block.appendChild(body);
      panel.appendChild(block);
    });
  }

  /* ---- 受賞チーム名の入力欄（表彰スライドだけを抜き出して並べる） ---- */
  function teamSection() {
    const awards = work.slides.filter((s) => s.type === "award");
    if (!awards.length) return;
    const box = h("div", "ed-teams");
    box.appendChild(h("h4", null, "🏆 受賞チームを選択"));
    box.appendChild(h("div", "ed-help",
      "賞ごとにチームを選んで「保存して表示に反映」を押すだけでOK。画面上では D キーを3回押すまで、チーム名も発表資料（1ページ目）も出ません。"));
    // 選択肢＝発表順のチーム一覧（js/pitch-data-day2.js）。一覧が無いときは従来どおり手入力
    const teams = (typeof PITCH_TEAMS !== "undefined") ? PITCH_TEAMS : [];
    const rows = [];
    const syncAll = () => {
      rows.forEach((r) => {
        const v = (r.s.team || "").trim();
        const dup = v && awards.some((o) => o !== r.s && (o.team || "").trim() === v);
        r.row.classList.toggle("is-set", !!v);
        r.state.textContent = !v ? "未選択" : (dup ? "✓ 選択済み（⚠ 他の賞と同じチームです）" : "✓ 選択済み");
      });
    };
    awards.forEach((s) => {
      const row = h("div", "ed-team");
      row.appendChild(h("div", "ed-team-award", strip(s.award || "")));
      let inp;
      if (teams.length) {
        inp = document.createElement("select");
        inp.appendChild(new Option("── チームを選択 ──", ""));
        teams.forEach((t) => inp.appendChild(new Option(String(t.no).padStart(2, "0") + "　" + t.name, t.name)));
        // 以前に手入力した名前が一覧に無い場合も、消さずに選択肢として残す
        const cur = (s.team || "").trim();
        if (cur && !teams.some((t) => t.name === cur)) inp.appendChild(new Option("（手入力）" + cur, cur));
        inp.value = cur;
        inp.onchange = () => { s.team = inp.value; syncAll(); };
      } else {
        inp = document.createElement("input");
        inp.type = "text"; inp.value = s.team || ""; inp.placeholder = "チーム名を入力";
        inp.oninput = () => { s.team = inp.value; syncAll(); };
        inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); saveAndReload(); } };
      }
      const state = h("div", "ed-team-state");
      rows.push({ s, row, state });
      row.append(inp, state);
      box.appendChild(row);
    });
    syncAll();
    const save = h("button", "ed-save", "保存して表示に反映");
    save.onclick = saveAndReload;
    box.appendChild(save);
    panel.appendChild(box);
  }

  function move(i, d) { const j = i + d, a = work.slides; if (j < 0 || j >= a.length) return; const t = a[i]; a[i] = a[j]; a[j] = t; render(); }

  function buildFields(obj, container) {
    Object.keys(obj).forEach((k) => {
      const v = obj[k];
      if (typeof v === "string") {
        const row = h("label", "ed-field"); row.appendChild(h("span", "ed-key", k));
        const ta = document.createElement("textarea"); ta.value = v; ta.rows = v.length > 38 ? 3 : 1;
        ta.oninput = () => { obj[k] = ta.value; };
        row.appendChild(ta); container.appendChild(row);
      } else if (typeof v === "boolean") {
        const row = h("label", "ed-field ed-check");
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = v; cb.onchange = () => { obj[k] = cb.checked; };
        row.appendChild(cb); row.appendChild(h("span", "ed-key", k)); container.appendChild(row);
      } else if (typeof v === "number") {
        const row = h("label", "ed-field"); row.appendChild(h("span", "ed-key", k));
        const inp = document.createElement("input"); inp.value = v; inp.oninput = () => { obj[k] = inp.value; };
        row.appendChild(inp); container.appendChild(row);
      } else if (Array.isArray(v)) {
        const grp = h("div", "ed-group"); grp.appendChild(h("div", "ed-grpkey", k + "　［" + v.length + "］"));
        v.forEach((item, idx) => {
          if (typeof item === "string") {
            const row = h("label", "ed-field"); row.appendChild(h("span", "ed-key", String(idx + 1)));
            const ta = document.createElement("textarea"); ta.value = item; ta.rows = 1; ta.oninput = () => { v[idx] = ta.value; };
            row.appendChild(ta); grp.appendChild(row);
          } else if (item && typeof item === "object") {
            const sub = h("div", "ed-subitem"); sub.appendChild(h("div", "ed-subh", k + " " + (idx + 1)));
            buildFields(item, sub); grp.appendChild(sub);
          }
        });
        container.appendChild(grp);
      } else if (v && typeof v === "object") {
        const grp = h("div", "ed-group"); grp.appendChild(h("div", "ed-grpkey", k));
        buildFields(v, grp); container.appendChild(grp);
      }
    });
  }

  function download() {
    const text = "/* slides-data.js — 編集画面から書き出し */\nconst DECK = " + JSON.stringify(work, null, 2) + ";\n";
    const blob = new Blob([text], { type: "text/javascript" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "slides-data.js"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  // 文字列 → 短いハッシュ（版の生成用）
  function hashStr(s) { let hh = 5381, i = s.length; while (i) { hh = (hh * 33) ^ s.charCodeAt(--i); } return (hh >>> 0).toString(16); }

  // 編集を反映した「完成版HTML」を書き出す（単体版HTML専用）
  function exportHtml() {
    const inlineScripts = Array.prototype.slice.call(document.querySelectorAll("script")).filter((s) => !s.src);
    const hasInlineDeck = inlineScripts.some((s) => /const\s+DECK\s*=/.test(s.textContent));
    if (!hasInlineDeck) {
      alert("この書き出しは『単体版HTML（〜_プレゼン.html）』でのみ使えます。\nそちらを開いて実行してください。");
      return;
    }
    const deckStr = JSON.stringify(work, null, 2);
    const newVer  = hashStr(deckStr);

    // 現在のページを複製し、実行時に生成されたDOMを取り除いてから中身を差し替える
    const docEl = document.documentElement.cloneNode(true);
    ["#slides", ".rain", ".dots"].forEach((sel) => { const e = docEl.querySelector(sel); if (e) e.innerHTML = ""; });
    ["#ed-style", ".editor-btn", ".editor-panel", ".corner-logo"].forEach((sel) => { const e = docEl.querySelector(sel); if (e) e.remove(); });

    const cScripts = Array.prototype.slice.call(docEl.querySelectorAll("script")).filter((s) => !s.src);
    const cDeck = cScripts.filter((s) => /const\s+DECK\s*=/.test(s.textContent))[0];
    const cVer  = cScripts.filter((s) => /var\s+DECK_VERSION\s*=/.test(s.textContent))[0];
    if (cDeck) cDeck.textContent = "/* slides-data（編集画面から書き出し） */\nconst DECK = " + deckStr + ";\n";
    if (cVer)  cVer.textContent  = 'var DECK_VERSION = "' + newVer + '";';

    const html = "<!DOCTYPE html>\n" + docEl.outerHTML;
    const blob = new Blob([html], { type: "text/html" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    // 開いているファイルと同じ名前で書き出す（Day1／Day2 を取り違えない）
    const fname = decodeURIComponent((location.pathname.split("/").pop() || "")) || "プレゼン.html";
    a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    alert("書き出しました。\nダウンロードされた『" + fname + "』で、元のファイルを上書き保存してください。");
  }
})();

</script>
</body>
</html>
