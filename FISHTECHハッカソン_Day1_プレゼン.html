<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石川の海の幸×ハッカソン Day1｜司会プレゼン</title>

  <!-- Google Fonts（公式特設サイトと同じ：Shippori Mincho＋Noto Sans JP。ネットが無い場合は游明朝/游ゴシックで表示） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
/* =====================================================================
   酒 × ハッカソン  司会用プレゼンアプリ  スタイル
   --- デザインは公式特設サイト（加賀五彩＋ネオン／和フォント）を踏襲 ---
   ※ 色・フォントなど「見た目の調整」はこのファイル。
     文章・画像の差し替えは  js/slides-data.js  を編集してください。
   ===================================================================== */

:root {
  /* --- ベースカラー --- */
  --color-bg:   #EAE6DB; /* 少し渋めの生成り */
  --color-text: #111111; /* 漆黒 */

  /* --- 加賀五彩 --- */
  --kaga-enji:     #9d2b45; /* 臙脂 */
  --kaga-ai:       #234978; /* 藍 */
  --kaga-oudo:     #c69956; /* 黄土 */
  --kaga-kusa:     #597a59; /* 草 */
  --kaga-murasaki: #6e557b; /* 古代紫 */

  /* --- ネオン（差し色・発光） --- */
  --neon-enji:     #ff4772;
  --neon-ai:       #4793ff;
  --neon-oudo:     #ffc46b;
  --neon-kusa:     #85ff85;
  --neon-murasaki: #dfacff;

  --stage-w: 1280px; /* 基準ステージ幅（16:9） */
  --stage-h: 720px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--color-text);
  color: var(--color-text);
  font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.font-fude { font-family: 'Yuji Syuku', 'Shippori Mincho', serif; }
.font-tech { font-family: 'Share Tech Mono', monospace; letter-spacing: .04em; }

/* =====================================================================
   ステージ（16:9 を画面いっぱいにスケール）
   ===================================================================== */
#stage-scaler {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 50% 30%, #f3efe6 0%, var(--color-bg) 55%, #ddd7c7 100%);
}
#stage {
  position: relative;
  width: var(--stage-w); height: var(--stage-h);
  overflow: hidden;
  background: var(--color-bg);
  box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 30px 80px rgba(0,0,0,.45);
  transform-origin: center center;
}

/* 和紙風グレイン＆罫線 */
#stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 60;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply; opacity: .5;
}

/* =====================================================================
   背景レイヤー（全スライド共通・常に動く）
   ===================================================================== */
.bg-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

/* 回転する曼荼羅（円相） */
.mandala {
  position: absolute; top: 50%; left: 50%;
  width: 1200px; height: 1200px; transform: translate(-50%,-50%);
  opacity: .22; animation: spin-slow 120s linear infinite;
}
@keyframes spin-slow { from { transform: translate(-50%,-50%) rotate(0); } to { transform: translate(-50%,-50%) rotate(360deg); } }

/* 流れる雲 */
.kumo { position: absolute; left: 0; opacity: .55; will-change: transform; user-select: none; }
@keyframes floatCloud        { 0% { transform: translateX(-340px);} 100% { transform: translateX(1340px);} }
@keyframes floatCloudReverse { 0% { transform: translateX(1340px);} 100% { transform: translateX(-340px);} }

/* マトリックス風の雨（うっすら） */
.rain { position: absolute; inset: 0; opacity: .10; z-index: 0; }
.rain-col {
  position: absolute; top: -20%;
  font-family: 'Share Tech Mono', monospace; font-weight: 700;
  color: var(--kaga-ai); writing-mode: vertical-rl; white-space: nowrap;
  font-size: 18px; line-height: 1; animation: rainDown linear infinite;
}
@keyframes rainDown { 0% { transform: translateY(-100%); } 100% { transform: translateY(120vh); } }

/* =====================================================================
   常駐グリッチロゴ（右下・ずっと「がびがび」動く）
   ===================================================================== */
.corner-logo { position: absolute; right: 26px; bottom: 22px; width: 150px; z-index: 50; }
.corner-logo .glitch { width: 100%; }

/* グリッチ本体（3枚重ね） */
.glitch { position: relative; display: inline-block; line-height: 0; }
.glitch__img { display: block; width: 100%; height: auto; object-fit: contain; }
.glitch__img--base { position: relative; z-index: 2; animation: glitch-anim-1 4s infinite linear alternate-reverse; }
.glitch__img--r, .glitch__img--b {
  position: absolute; top: 0; left: 0; z-index: 1; mix-blend-mode: hard-light;
}
.glitch__img--r {
  filter: drop-shadow(-2px 0 var(--neon-enji)) saturate(1.4);
  animation: glitch-anim-2 3s infinite linear alternate-reverse;
}
.glitch__img--b {
  filter: drop-shadow(2px 0 var(--neon-ai)) saturate(1.4);
  animation: glitch-anim-3 2.5s infinite linear alternate-reverse;
}
@keyframes glitch-anim-1 {
  0%,95%{ transform:translate(0,0); filter:hue-rotate(0deg);}
  96%{ transform:translate(-2px,2px); filter:hue-rotate(90deg);}
  98%{ transform:translate(2px,-2px); filter:hue-rotate(0deg);}
  100%{ transform:translate(0,0);} }
@keyframes glitch-anim-2 {
  0%,90%{ clip-path:polygon(0 20%,100% 20%,100% 30%,0 30%); transform:translate(0);}
  92%{ clip-path:polygon(0 10%,100% 10%,100% 15%,0 15%); transform:translate(5px);}
  94%{ clip-path:polygon(0 80%,100% 80%,100% 90%,0 90%); transform:translate(-5px);}
  100%{ clip-path:polygon(0 20%,100% 20%,100% 30%,0 30%); transform:translate(0);} }
@keyframes glitch-anim-3 {
  0%,85%{ clip-path:polygon(0 60%,100% 60%,100% 70%,0 70%); transform:translate(0);}
  87%{ clip-path:polygon(0 40%,100% 40%,100% 45%,0 45%); transform:translate(-4px);}
  89%{ clip-path:polygon(0 90%,100% 90%,100% 95%,0 95%); transform:translate(4px);}
  100%{ clip-path:polygon(0 60%,100% 60%,100% 70%,0 70%); transform:translate(0);} }

/* =====================================================================
   スライド本体
   ===================================================================== */
#slides { position: absolute; inset: 0; z-index: 10; }
.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 64px 88px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: scale(1.03);
  transition: opacity .55s ease, transform .55s ease, visibility .55s;
}
.slide.is-active { opacity: 1; visibility: visible; pointer-events: auto; transform: scale(1); }

/* 中身ラッパー：枠を超えたらJSがここを縮小する（縦はみ出し防止） */
.slide-content { width: 100%; will-change: transform; }

/* スライド共通パーツ */
.kicker {
  display: inline-flex; align-items: center; gap: .6em;
  font-family: 'Share Tech Mono', monospace; font-weight: 700;
  font-size: 21px; letter-spacing: .18em;
  color: var(--color-bg); background: var(--color-text);
  padding: 7px 18px; align-self: flex-start;
}
.kicker .en { color: var(--neon-oudo); }
.slide-title {
  font-family: 'Yuji Syuku', serif; font-weight: 700;
  font-size: 70px; line-height: 1.08;
  margin: 18px 0 10px; color: var(--color-text);
}
.slide-title .accent { color: var(--kaga-enji); }
/* カタカナが筆書体(Yuji Syuku)で薄く見える箇所を明朝に切替 */
.slide-title .alt { font-family: 'Shippori Mincho', serif; }
.title-rule { width: 120px; height: 8px; background: linear-gradient(90deg, var(--kaga-enji), var(--kaga-oudo)); margin-bottom: 26px; }
.lead { font-size: 31px; line-height: 1.75; max-width: 52ch; font-weight: 500; }
.lead .hi { font-weight: 700; color: var(--kaga-ai); }
.lead .hi-enji { font-weight: 700; color: var(--kaga-enji); }
/* 強調（.lead 以外＝審査基準・案内などでも効くように） */
.hi { font-weight: 700; color: var(--kaga-ai); }
.hi-enji { font-weight: 700; color: var(--kaga-enji); }

/* 入場アニメ（is-active時に段階表示） */
[data-anim] { opacity: 0; transform: translateY(26px); }
.slide.is-active [data-anim] { animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
.slide.is-active [data-anim="1"]{ animation-delay:.10s; }
.slide.is-active [data-anim="2"]{ animation-delay:.22s; }
.slide.is-active [data-anim="3"]{ animation-delay:.34s; }
.slide.is-active [data-anim="4"]{ animation-delay:.46s; }
.slide.is-active [data-anim="5"]{ animation-delay:.58s; }
.slide.is-active [data-anim="6"]{ animation-delay:.70s; }
.slide.is-active [data-anim="7"]{ animation-delay:.82s; }
.slide.is-active [data-anim="8"]{ animation-delay:.94s; }
@keyframes rise { to { opacity: 1; transform: translateY(0); } }

/* =====================================================================
   待機スライド（開演前）
   ===================================================================== */
.standby { align-items: center; justify-content: center; text-align: center; }
.standby .sb-main {
  font-size: 66px; color: var(--color-text); letter-spacing: .14em;
  text-shadow: 4px 4px 0 rgba(198,153,86,.35);
}
.standby .sb-sub {
  margin-top: 22px; font-size: 20px; letter-spacing: .26em; color: var(--kaga-ai);
}

/* =====================================================================
   表紙スライド
   ===================================================================== */
.cover { align-items: center; text-align: center; }
.cover .cover-logo { width: min(760px, 78%); margin: 0 auto 8px; }
.cover .cover-sub {
  display: inline-block; margin-top: 8px;
  font-family: 'Share Tech Mono', monospace; font-weight: 700; letter-spacing: .25em; font-size: 22px;
  color: var(--color-bg); background: var(--kaga-ai);
  padding: 10px 26px; transform: rotate(-1deg);
  box-shadow: 5px 5px 0 var(--kaga-oudo);
}
.cover .cover-fude { margin-top: 28px; font-family: 'Yuji Syuku', serif; font-size: 56px; color: var(--kaga-enji); letter-spacing: .2em; }
.cover .cover-date { margin-top: 16px; font-family:'Share Tech Mono',monospace; font-size: 20px; color: var(--color-text); }

/* =====================================================================
   汎用カード／グリッド
   ===================================================================== */
.grid { display: grid; gap: 22px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
/* Deep Research の手順カード：見出しを1行に（枠は内容に合わせて広がる） */
.research-grid .card h3 { white-space: nowrap; }
.grid-4 { grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-4 .guest .g-name { font-size: 24px; }
.grid-4 .guest .g-role { font-size: 16px; }

.card {
  position: relative; background: #fff;
  border: 2px solid var(--color-text);
  padding: 22px 24px;
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
  box-shadow: 7px 7px 0 var(--color-text);
}
.card .card-bar { position: absolute; top: 0; left: 0; width: 100%; height: 7px; }
.card h3 { font-family: 'Shippori Mincho', serif; font-size: 31px; margin-bottom: 8px; }
.card p { font-size: 20px; line-height: 1.6; color: #333; }
.card .tag {
  display: inline-block; font-family:'Share Tech Mono',monospace; font-weight:700; font-size: 16px;
  color: var(--neon-oudo); background: var(--color-text); padding: 3px 10px; margin-bottom: 10px; letter-spacing:.1em;
}

/* テーマ：アイデア例リスト */
.idea-list { list-style: none; display: grid; gap: 14px; }
.idea-list li {
  position: relative; padding: 18px 22px 18px 64px;
  background: #fff; border-left: 8px solid var(--kaga-murasaki);
  font-size: 30px; font-weight: 700; color: var(--color-text);
  box-shadow: 4px 4px 0 rgba(0,0,0,.12);
}
.idea-list li::before {
  content: attr(data-no); position: absolute; left: 0; top: 0; bottom: 0; width: 48px; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  background: var(--kaga-murasaki); color: #fff; font-family:'Share Tech Mono',monospace;
}

/* ゲストカード */
.guest { text-align: center; }
.guest .photo {
  width: 100%; aspect-ratio: 1/1; object-fit: cover;
  border: 3px solid var(--color-text); background: #efeadd;
  filter: saturate(.95);
}
.guest .photo.placeholder {
  display:flex; align-items:center; justify-content:center;
  font-family:'Share Tech Mono',monospace; color:#9a917c; font-size:20px; letter-spacing:.1em;
}
/* ロゴ等を切らずに全体表示（酒蔵の銘柄ロゴ向け） */
.guest .photo.fit-contain { object-fit: contain; }
.guest .g-name { font-family:'Shippori Mincho',serif; font-weight:700; font-size: 28px; margin-top:12px; }
.guest .g-role { font-size: 18px; color: var(--kaga-enji); font-weight:700; margin-top:5px; }
.guest .g-org  { font-size: 16px; color:#555; margin-top:3px; }

/* 審査基準 */
.criteria { display: grid; gap: 16px; }
.criteria-row {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px;
  background: #fff; border: 2px solid var(--color-text); padding: 14px 20px;
  box-shadow: 5px 5px 0 var(--color-text);
}
.criteria-row .c-no {
  font-family:'Share Tech Mono',monospace; font-weight:700; font-size: 22px;
  width: 48px; height: 48px; display:flex; align-items:center; justify-content:center;
  background: var(--color-text); color: var(--neon-kusa); font-size: 26px;
}
.criteria-row .c-name { font-family:'Shippori Mincho',serif; font-weight:700; font-size: 29px; }
.criteria-row .c-desc { font-size: 19px; color:#555; margin-top: 3px; }
.criteria-row .c-weight {
  font-family:'Share Tech Mono',monospace; font-weight:700; font-size: 32px; color: var(--kaga-enji);
}

/* スケジュール（タイムテーブル） */
.timetable { display: grid; gap: 0; max-width: 1140px; }
.tt-row {
  display: grid; grid-template-columns: 128px 1fr; gap: 20px; align-items: stretch;
  padding: 11px 0;
}
.tt-time {
  font-family:'Share Tech Mono',monospace; font-weight:700;
  color: var(--color-text); text-align: right; padding-top: 6px; font-size: 30px;
}
.tt-body { position: relative; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 14px; padding: 6px 0 10px 26px; border-left: 3px solid var(--kaga-oudo); }
.tt-body::before {
  content:""; position:absolute; left: -11px; top: 14px; width: 18px; height: 18px;
  background: var(--kaga-enji); border: 3px solid var(--color-bg); border-radius: 50%;
}
.tt-row.is-now .tt-body::before { background: var(--neon-enji); box-shadow: 0 0 0 4px rgba(255,71,114,.3); }
.tt-title { font-family:'Shippori Mincho',serif; font-weight:700; font-size: 27px; }
.tt-desc { font-size: 18px; color:#333; }
.tt-day-pill {
  align-self:flex-start; font-family:'Share Tech Mono',monospace; font-weight:700; font-size: 19px;
  background: var(--color-text); color: var(--neon-oudo); padding: 8px 18px; margin-bottom: 20px; letter-spacing:.12em;
}

/* 過去イベント（年表風） */
.history-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.event-card { position: relative; background:#fff; border:2px solid var(--color-text); box-shadow: 8px 8px 0 var(--color-text); overflow:hidden; }
.event-card .ec-photo { width:100%; height: 190px; object-fit: cover; background:#e7e1d2; display:block; }
.event-card .ec-photo.placeholder { display:flex; align-items:center; justify-content:center; font-family:'Share Tech Mono',monospace; color:#9a917c; }
.event-card .ec-body { padding: 18px 22px 22px; }
.event-card .ec-edition { font-family:'Share Tech Mono',monospace; font-weight:700; color: var(--neon-oudo); background: var(--color-text); display:inline-block; padding: 4px 14px; font-size: 22px; }
.event-card .ec-title { font-family:'Yuji Syuku',serif; font-size: 44px; margin: 10px 0 8px; }
.event-card .ec-title .x { color: var(--kaga-enji); }
.event-card .ec-desc { font-size: 19px; color:#444; line-height:1.6; }

/* 結び */
.closing { align-items: center; text-align: center; justify-content: center; }
.closing .big-fude { font-family:'Yuji Syuku',serif; font-size: 132px; color: var(--kaga-enji); letter-spacing:.12em; text-shadow: 6px 6px 0 var(--kaga-oudo); }
.closing .closing-sub { margin-top: 24px; font-size: 30px; font-weight:700; }

/* draftバッジ（内容未確定の目印・確定したらデータ側でfalseに） */
.draft-badge {
  position:absolute; top: 14px; right: 18px; z-index: 40;
  font-family:'Share Tech Mono',monospace; font-size: 12px; font-weight:700; letter-spacing:.1em;
  color:#fff; background: var(--neon-enji); padding: 4px 10px; transform: rotate(3deg);
  box-shadow: 2px 2px 0 rgba(0,0,0,.3);
}

/* =====================================================================
   操作系UI（進捗バー・ページ番号・矢印・ヒント）
   ===================================================================== */
.progress { position:absolute; left:0; bottom:0; height:6px; z-index:55;
  background: linear-gradient(90deg, var(--kaga-enji), var(--kaga-oudo)); width:0; transition: width .4s ease; }
.pager { position:absolute; left: 26px; bottom: 20px; z-index:55;
  font-family:'Share Tech Mono',monospace; font-weight:700; font-size: 15px; color: var(--color-text); }
.pager .cur { color: var(--kaga-enji); font-size: 20px; }
.nav-arrow {
  position:absolute; top:50%; transform: translateY(-50%); z-index: 55;
  width: 54px; height: 54px; border: 2px solid var(--color-text); background: rgba(255,255,255,.7);
  font-size: 24px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition: background .2s, color .2s; backdrop-filter: blur(2px);
}
.nav-arrow:hover { background: var(--kaga-enji); color:#fff; }
.nav-prev { left: 18px; } .nav-next { right: 18px; }
.dots { position:absolute; left:50%; transform:translateX(-50%); bottom: 18px; z-index:55; display:flex; gap:9px; }
.dot { width:10px; height:10px; border:1.5px solid var(--color-text); background:transparent; cursor:pointer; transition: all .2s; }
.dot.active { background: var(--kaga-enji); border-color: var(--kaga-enji); transform: scale(1.25); }
.hint {
  position:absolute; right: 22px; top: 18px; z-index:55;
  font-family:'Share Tech Mono',monospace; font-size: 12px; color:#7c7460;
  background: rgba(255,255,255,.6); padding: 6px 10px; border:1px solid #cfc7b3;
  transition: opacity .4s;
}
.hint b { color: var(--kaga-enji); }
.is-fs .hint, .is-fs .nav-arrow { opacity: 0; }
.is-fs .nav-arrow:hover { opacity: 1; }

@media (max-width: 700px) {
  .hint { display:none; }
}

/* =====================================================================
   ★ 文字を全体的に拡大（大画面・遠距離視認向け）
   ─ 後ろに書いて上書き。混みすぎたスライドは自動縮小で調整されます。
   ===================================================================== */
.slide { padding: 52px 76px; }
/* タイトルは折り返さないサイズに（最長「石川県オープンデータハッカソンの系譜」が1行に収まる） */
.slide-title { font-size: 60px; white-space: nowrap; }
.lead { font-size: 40px; }
.kicker { font-size: 26px; }

.card h3 { font-size: 39px; }
.card p  { font-size: 26px; }
.card .tag { font-size: 22px; }

.idea-list li { font-size: 37px; }

.guest .g-name { font-size: 35px; }
.guest .g-role { font-size: 24px; }
.guest .g-org  { font-size: 22px; }
.grid-4 .guest .g-name { font-size: 30px; }
.grid-4 .guest .g-role { font-size: 19px; white-space: nowrap; }
.grid-4 .guest .g-org  { font-size: 18px; white-space: nowrap; }

.criteria-row .c-no     { font-size: 33px; }
.criteria-row .c-name   { font-size: 37px; }
.criteria-row .c-desc   { font-size: 26px; }
.criteria-row .c-weight { font-size: 42px; }

.tt-time     { font-size: 40px; }
.tt-title    { font-size: 36px; }
.tt-desc     { font-size: 31px; }
.tt-day-pill { font-size: 25px; }

.event-card .ec-title { font-size: 46px; white-space: nowrap; }
.event-card .ec-desc  { font-size: 27px; }
.event-card .ec-photo { height: 240px; }
/* 縦長ポスター等を「引きの絵」で全体表示（文字が途切れない） */
.event-card .ec-photo.fit-contain { object-fit: contain; background: #efeadd; }

.standby .sb-main { font-size: 80px; }
.standby .sb-sub  { font-size: 26px; }
.cover .cover-fude { font-size: 66px; }
.cover .cover-date { font-size: 24px; }
.closing .closing-sub { font-size: 38px; }

/* 区切りスライド（中央に単語だけ） */
.section { align-items: center; justify-content: center; text-align: center; }
.section .section-title {
  font-family: 'Shippori Mincho', serif; font-weight: 800;
  font-size: 108px; color: var(--color-text); letter-spacing: .1em;
}
.section .section-sub { margin-top: 18px; font-size: 26px; letter-spacing: .32em; color: var(--kaga-ai); }

/* =====================================================================
   フロー：第一幕 →（開発期間・矢羽根）→ 第二幕
   ===================================================================== */
.flow { display: flex; align-items: stretch; gap: 22px; margin-top: 10px; }
.flow > .flow-card { flex: 1 1 0; }
.flow .flow-card { display: flex; flex-direction: column; }

/* 中央の矢羽根（右向き五角形）。外側=黒枠、内側=白。影は figure に drop-shadow で付与 */
.flow-chevron-wrap {
  flex: 0.9 1 0;
  align-self: center;                           /* 縦はカード全高まで伸ばさず中央に */
  filter: drop-shadow(6px 6px 0 var(--color-text));
}
.flow-chevron {
  background: var(--color-text);               /* 枠色 */
  padding: 2px;                                 /* 2px の枠を見せる */
  clip-path: polygon(0 0, 76% 0, 100% 50%, 76% 100%, 0 100%);
}
.flow-chevron .inner {
  position: relative;
  padding: 15px 26% 15px 24px;                  /* 縦を短く／右は矢印の先を避ける */
  background: #fff;
  clip-path: polygon(0 0, 76% 0, 100% 50%, 76% 100%, 0 100%);
}
.flow-chevron .inner .card-bar { position: absolute; top: 0; left: 0; width: 100%; height: 7px; }

/* パネル内テキスト（カード・矢羽根 共通） */
.flow-label {
  font-family: 'Shippori Mincho', serif; font-weight: 800;
  font-size: 29px; color: var(--color-text); margin-bottom: 4px;
}
.flow-chevron .inner h3 { font-family: 'Shippori Mincho', serif; font-size: 38px; margin-bottom: 8px; }
.flow-chevron .inner p  { font-size: 26px; line-height: 1.55; color: #333; }

/* =====================================================================
   案内スライド（酒蔵見学など）：バナー＋ラベル付き項目リスト
   ===================================================================== */
.notice-banner {
  align-self: flex-start;
  font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 33px;
  color: var(--color-text);
  background: rgba(122, 158, 74, .20);          /* 加賀・草のうすい帯 */
  border-left: 10px solid var(--kaga-kusa);
  padding: 12px 26px; margin: 4px 0 22px;
}
.notice-list { display: grid; gap: 22px; }
.notice-row  { display: grid; grid-template-columns: 150px 1fr; gap: 24px; align-items: start; }
.notice-label {
  font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 33px;
  color: var(--kaga-enji); border-bottom: 3px solid var(--kaga-oudo);
  padding-bottom: 3px; justify-self: start;
}
.notice-item {
  position: relative; font-size: 31px; line-height: 1.5; color: #222;
  padding-left: 30px; margin-bottom: 6px; font-weight: 500;
}
.notice-item::before {
  content: "▪"; position: absolute; left: 4px; top: -1px; color: var(--kaga-ai);
}
.notice-sub { font-size: 24px; color: #6e6450; margin-top: 2px; padding-left: 30px; }
/* compact: ラベル（「会場の皆様へ」など長め）を1行に収め、本文をひと回り小さく */
.notice-compact .notice-row   { grid-template-columns: 190px 1fr; gap: 20px; }
.notice-compact .notice-label { white-space: nowrap; font-size: 28px; }
.notice-compact .notice-item  { font-size: 25px; }
.notice-compact .notice-banner { font-size: 30px; }
/* 右に画像を並べる2カラム */
.notice-cols { display: grid; grid-template-columns: 1.35fr 0.8fr; gap: 36px; align-items: start; }
.notice-cols .notice-row { grid-template-columns: 100px 1fr; gap: 16px; }
.notice-cols .notice-list { gap: 20px; }
.notice-fig { margin: 0; text-align: center; }
.notice-img { width: 100%; height: auto; max-height: 500px; object-fit: contain; border: 2px solid var(--color-text); box-shadow: 6px 6px 0 var(--color-text); display: block; }
.notice-fig figcaption { font-size: 20px; color: #6e6450; margin-top: 10px; }
.notice-img.placeholder { aspect-ratio: 4/3; height: auto; display: flex; align-items: center; justify-content: center; background: #efeadd; color: #9a917c; font-family: 'Share Tech Mono', monospace; font-size: 22px; }

/* =====================================================================
   登壇者スライド（画像＋タイトルのみ・中央に大きく）
   ===================================================================== */
.input2 { display: flex; align-items: center; justify-content: space-between; gap: 56px; }
.input2-left { flex: 1 1 auto; }
.input-title { white-space: nowrap; font-size: 54px; }   /* 1行に収める（折り返さない） */
.input-photo { flex: 0 0 44%; max-width: 540px; }
.input-photo .photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.input-photo .g-name { font-size: 44px; margin-top: 16px; }
.input-photo .g-role { font-size: 28px; }

/* =====================================================================
 *  表彰スライドの発表演出（Day2）
 *  ドラムロール中はチーム名が揺れ、発表でフラッシュ＋紙吹雪＋ばん
 * ===================================================================== */
/* ※ .slide は position:absolute; inset:0 なので、ここで position を上書きしないこと
 *   （relative にすると絶対配置が外れてスライドが流し込みになり、画面外へ落ちる） */
.slide.award { overflow: hidden; }

/* 枠・チーム名の基本色（インラインに書くと状態別の色が効かなくなるのでここで指定） */
.award-box  { border-color: var(--kaga-ai); }
.award-team { color: var(--kaga-ai); letter-spacing: .06em; }

/* 伏せている間 */
.award-team { transition: color .2s ease; }
.slide.award:not(.is-revealed) .award-team { color: #9aa3b0; letter-spacing: .28em; }

/* ドラムロール中：枠がじりじり震える＋縁が明滅 */
.slide.award.is-rolling .award-box { animation: awardShake .09s linear infinite, awardEdge 1.1s ease-in-out infinite; }
.slide.award.is-rolling .award-team { animation: awardBlink .5s steps(2, end) infinite; }
@keyframes awardShake {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-2px, 1px); }
  50%  { transform: translate(2px, -1px); }
  75%  { transform: translate(-1px, -2px); }
  100% { transform: translate(1px, 2px); }
}
@keyframes awardEdge {
  0%, 100% { border-color: var(--kaga-ai); }
  50%      { border-color: var(--kaga-enji); }
}
@keyframes awardBlink { 0% { opacity: 1; } 100% { opacity: .45; } }

/* シンバル後（D 2回目）：揺れが止まり、臙脂の枠でタメる。名前はまだ伏せ字 */
.slide.award.is-hit .award-box {
  border-color: var(--kaga-enji);
  box-shadow: 10px 10px 0 rgba(157, 43, 69, .22);
  animation: awardBoxPop .5s cubic-bezier(.16, 1.5, .3, 1) both;
}
.slide.award.is-hit .award-team { color: var(--kaga-enji); }

/* 発表の瞬間 */
.slide.award.is-revealed .award-team {
  color: var(--kaga-enji);
  letter-spacing: .06em;
  text-shadow: 4px 4px 0 var(--kaga-oudo);
  animation: awardPop .62s cubic-bezier(.16, 1.5, .3, 1) both;
}
.slide.award.is-revealed .award-box {
  border-color: var(--kaga-enji);
  box-shadow: 10px 10px 0 rgba(157, 43, 69, .22);
  animation: awardBoxPop .5s cubic-bezier(.16, 1.5, .3, 1) both;
}
@keyframes awardPop {
  0%   { transform: scale(.45); filter: blur(16px); opacity: 0; }
  55%  { transform: scale(1.14); filter: blur(0);   opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes awardBoxPop {
  0%   { transform: scale(.94); }
  60%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}

/* チーム名が未入力のまま発表したとき（リハーサルで気づけるように） */
.slide.award.is-revealed.is-empty .award-team { color: #9aa3b0; font-size: 34px !important; text-shadow: none; }

/* plain: 枠・WINNER・伏せ字を出さず、チーム名の文字だけを見せる（SAKE Value Creation Award で試用）
 *   箱は透明にして残す＝高さが変わらずレイアウトが跳ねない／クリック操作もそのまま使える */
.slide.award-plain .award-box {
  background: transparent !important; border-color: transparent !important;
  box-shadow: none !important; animation: none !important;
}
.slide.award-plain .award-label { visibility: hidden; }
.slide.award-plain:not(.is-revealed) .award-team { color: transparent !important; text-shadow: none; animation: none !important; }

/* 受賞チームの発表資料1ページ目（D 3回目で出る）
 *   場所は最初から確保（高さ固定）＝発表の瞬間に賞名が上へ跳ねない。16:9 以外の資料は contain で収める */
.slide.award.has-shot { justify-content: flex-start; padding-top: 34px; }
.slide.award.has-shot .award-box { margin-top: 10px !important; padding: 4px 40px 8px !important; }
.slide.award-plain.has-shot .award-label { display: none; }
.award-team { white-space: nowrap; }
.award-shot { width: 608px; height: 342px; margin: 10px auto 0; }
.slide.award.has-shot .award-holder { flex: none; }
.award-shot-img {
  display: block; width: 100%; height: 100%; object-fit: contain;
  background: #fff; box-shadow: 10px 10px 0 rgba(157, 43, 69, .22); border: 3px solid var(--kaga-enji);
  animation: awardShotIn .7s cubic-bezier(.16, 1.3, .3, 1) .12s both;
}
@keyframes awardShotIn {
  0%   { transform: translateY(24px) scale(.9); opacity: 0; }
  100% { transform: none; opacity: 1; }
}

/* 白フラッシュ */
.award-flash {
  position: absolute; inset: 0; background: #fff; pointer-events: none; z-index: 5;
  animation: awardFlash .6s ease-out forwards;
}
@keyframes awardFlash { 0% { opacity: .92; } 100% { opacity: 0; } }

/* 紙吹雪 */
.award-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
.award-confetti i {
  position: absolute; top: -6%; width: 12px; height: 20px; opacity: .95;
  animation-name: awardFall; animation-timing-function: cubic-bezier(.3, .6, .5, 1); animation-fill-mode: both;
}
@keyframes awardFall {
  0%   { transform: translateY(-10%) rotate(0deg);     opacity: 0; }
  10%  { opacity: .95; }
  100% { transform: translateY(820px) rotate(540deg);  opacity: .9; }
}

/* 動きを抑える設定の環境では演出を止める（アニメ酔い対策） */
@media (prefers-reduced-motion: reduce) {
  .slide.award.is-rolling .award-box,
  .slide.award.is-rolling .award-team,
  .slide.award.is-revealed .award-team,
  .slide.award.is-revealed .award-box,
  .slide.award.is-hit .award-box,
  .award-shot-img,
  .award-confetti i { animation: none !important; }
}

/* =====================================================================
 *  ピッチ（Day2）：チームの呼び込みスライド／発表資料（PDFページ画像）
 * ===================================================================== */
.slide.pitch { align-items: center; text-align: center; }
.slide.pitch .kicker { justify-content: center; }
.pitch-name {
  margin-top: 26px; line-height: 1.15; color: var(--kaga-enji); white-space: nowrap;   /* 折り返さない。はみ出す時はスライドごと自動縮小 */
  letter-spacing: .04em; text-shadow: 6px 6px 0 var(--kaga-oudo);
}
.pitch-title {
  margin-top: 22px; font-family: 'Shippori Mincho', serif; font-weight: 800;
  font-size: 46px; color: var(--kaga-ai); letter-spacing: .06em;
}
.pitch-nodata { margin-top: 26px; font-size: 20px; color: #9a917c; }

/* 資料ページ：余白なしで全面に。資料の比率が16:9でなくても切らずに収める */
.slide.pdfpage { padding: 0; background: #fff; transform: none; }
.slide.pdfpage .slide-content { width: 100%; height: 100%; }
.pdfpage-img { display: block; width: 100%; height: 100%; object-fit: contain; }
/* 資料表示中は、ロゴ・ページ番号・点・操作ヒントを隠す（矢印は透明のまま押せる） */
#stage.is-fullbleed .corner-logo,
#stage.is-fullbleed .pager,
#stage.is-fullbleed .dots,
#stage.is-fullbleed .hint { opacity: 0; pointer-events: none; }
#stage.is-fullbleed .nav-arrow { opacity: 0; }
#stage.is-fullbleed .nav-arrow:hover { opacity: .8; }
#stage.is-fullbleed .progress { opacity: .5; }
/* 呼び込みスライドの点は少し目立たせる（どこからがどのチームか分かるように） */
.dot.dot-pitch { border-color: var(--kaga-ai); }

/* 本日の賞：右側の「決まり方」の札（投票で決定＝藍／審査員特別賞＝臙脂） */
.criteria-row .c-tag {
  font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 24px; letter-spacing: .06em;
  color: #fff; background: var(--kaga-ai); padding: 6px 16px; white-space: nowrap;
}
.criteria-row .c-tag.is-alt { background: var(--kaga-enji); }
/* 札付きの「本日の賞」は右下ロゴと重ならない幅に */
.criteria.has-tags { max-width: 1000px; }

/* 案内スライドの右列：画像（ロゴ等）とQRコードを横に並べる */
.notice-fig.has-qr { display: flex; gap: 18px; align-items: flex-end; justify-content: center; }
.notice-fig.has-qr .notice-imgwrap { flex: 1 1 auto; min-width: 0; }
.notice-fig.has-qr .notice-img { max-height: 400px; width: auto; max-width: 100%; margin: 0 auto; }
.notice-qr { flex: 0 0 auto; width: 170px; background: #fff; border: 2px solid var(--color-text);
  box-shadow: 6px 6px 0 var(--color-text); padding: 10px 10px 8px; text-align: center; }
.notice-qr img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.notice-qr-label { margin-top: 6px; font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 19px; line-height: 1.3; color: var(--kaga-enji); }
.notice-qr.is-large { width: 260px; }
.notice-qr.is-large .notice-qr-label { font-size: 24px; }
/* 右列に画像・QRがある案内スライド：見出しを1行に、本文をひと回り小さく */
.notice-cols .notice-row { grid-template-columns: 150px 1fr; gap: 18px; }
.notice-cols .notice-label { white-space: nowrap; font-size: 27px; }
.notice-cols .notice-item { font-size: 26px; }
.notice-cols { grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.8fr); }   /* 右列が広がって枠からはみ出さないように */
.notice-fig.has-qr .notice-img { max-height: 255px; }   /* 右下の常駐ロゴと重ならない高さ */
.notice-fig.has-qr .notice-imgwrap + .notice-qr { width: 150px; }
/* 事務局より：QRを大きく */
.notice-qr.is-large { width: 330px; }
.notice-qr.is-large .notice-qr-label { font-size: 26px; }
/* figWide：右列（チラシ画像＋QR）を広く・大きく（次回のご案内） */
.notice-cols.fig-wide { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 28px; }
.notice-cols.fig-wide .notice-fig.has-qr .notice-img { max-height: 420px; }
.notice-cols.fig-wide .notice-fig.has-qr .notice-imgwrap + .notice-qr { width: 190px; }
.notice-cols.fig-wide .notice-qr-label { font-size: 21px; }
.notice-qr.is-large { width: 300px; }   /* 右下の常駐ロゴと重ならない大きさ */
.notice-cols.fig-wide { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; }
.notice-cols.fig-wide .notice-row { grid-template-columns: 112px 1fr; gap: 12px; }
.notice-cols.fig-wide .notice-label { font-size: 25px; }
.notice-cols.fig-wide .notice-item { font-size: 23px; }
.notice-cols.fig-wide .notice-fig.has-qr .notice-img { max-height: 360px; }
.notice-cols.fig-wide .notice-fig.has-qr .notice-imgwrap + .notice-qr { width: 175px; }
#stage.hide-corner .corner-logo { opacity: 0; pointer-events: none; }   /* QRのあるページは右下ロゴを隠す */

/* =====================================================================
 *  イベント告知（ポスター風）：中央の画像 → キャッチ → 日程カード＋QR
 * ===================================================================== */
.ev-img { display: flex; justify-content: center; margin-top: -6px; }
.ev-photo { display: block; height: 300px; width: auto; border: 2px solid var(--color-text); box-shadow: 6px 6px 0 var(--color-text); }
.ev-catch {
  margin-top: 18px; text-align: center; font-family: 'Shippori Mincho', serif; font-weight: 800;
  font-size: 40px; letter-spacing: .08em; color: var(--kaga-enji);
}
.ev-row { margin-top: 18px; display: flex; justify-content: center; align-items: stretch; gap: 22px; }
.ev-day { display: flex; align-items: stretch; background: #fff; border: 2px solid var(--color-text); box-shadow: 5px 5px 0 var(--color-text); }
.ev-day-label {
  display: flex; align-items: center; justify-content: center; padding: 0 16px;
  background: var(--color-text); color: var(--neon-kusa, #FFC46B); font-family: 'Share Tech Mono', monospace;
  font-weight: 700; font-size: 26px; letter-spacing: .06em; writing-mode: horizontal-tb;
}
.ev-day:nth-child(2) .ev-day-label { background: var(--kaga-enji); color: #fff; }
.ev-day-body { padding: 12px 22px; display: flex; flex-direction: column; justify-content: center; }
.ev-day-date { font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 30px; color: var(--color-text); white-space: nowrap; }
.ev-day-place { margin-top: 4px; font-size: 22px; color: #4b4436; white-space: nowrap; }
.notice-qr.ev-qr { width: 150px; padding: 8px 8px 6px; }
.notice-qr.ev-qr .notice-qr-label { font-size: 16px; }
.ev-day-label { white-space: nowrap; }
/* event 改訂：画像を大きく・右にQR／日程カードは細く小さく */
.ev-top { display: flex; justify-content: center; align-items: flex-end; gap: 22px; margin-top: -10px; }
.ev-top .ev-photo { height: 370px; }
.ev-top .notice-qr.ev-qr { width: 170px; }
.ev-top .notice-qr.ev-qr .notice-qr-label { font-size: 18px; }
.ev-catch { margin-top: 12px; font-size: 34px; }
.ev-row { margin-top: 12px; gap: 16px; }
.ev-day { box-shadow: 4px 4px 0 var(--color-text); }
.ev-day-label { font-size: 18px; padding: 0 12px; }
.ev-day-body { padding: 6px 16px; flex-direction: row; align-items: baseline; gap: 12px; }
.ev-day-date { font-size: 21px; }
.ev-day-place { margin-top: 0; font-size: 17px; }
.ev-day-label { font-size: 15px; padding: 0 10px; }
.ev-day-body { padding: 4px 12px; gap: 10px; }
.ev-day-date { font-size: 17px; }
.ev-day-place { font-size: 14px; }
.ev-top .ev-photo { height: 390px; }
.ev-top .notice-qr.ev-qr { width: 230px; }        /* QRを大きく */
.ev-top .notice-qr.ev-qr .notice-qr-label { font-size: 21px; }
.slide.pitch .pitch-name { margin-top: 0; }

/* 2026-09-27 オーナー指示：画面下のページ番号（136 / 152）と、ページを飛ばせる□（ドット）を非表示
 *   キー操作（← → 数字など）はそのまま使える。戻すときはこのブロックを消す */
.pager, .dots { display: none !important; }

/* #####################################################################
   ★ FISH × TECH HACKATHON 2026 テーマ（style.css の後に読み込んで上書き）
   公式特設サイト https://codefornoto.github.io/fishtech2026/ のデザインを踏襲：
   和紙色の地／墨色の太線＋ずらし影のカード／Shippori Mincho＋Noto Sans JP／
   泳ぐ魚のイラスト／画面下に「金沢 → 豊洲」の行列
   ※ style.css（酒×ハッカソン版）は部品の土台としてそのまま使っている
   ##################################################################### */
:root {
  --paper: #e9e4d8;
  --paper-light: #f8f5ed;
  --ink: #18242b;

  --color-bg:   var(--paper);
  --color-text: var(--ink);

  /* 加賀五彩の変数名のまま、サイトの色に差し替え（部品側は触らずに色が変わる） */
  --kaga-enji:     #a43b34; /* 朱（サイトの red） */
  --kaga-ai:       #1b455b; /* 藍（サイトの indigo） */
  --kaga-oudo:     #b58a3b; /* 金（サイトの gold） */
  --kaga-kusa:     #55705b; /* 緑（サイトの green） */
  --kaga-murasaki: #1b455b;

  --neon-enji:  #a43b34;
  --neon-ai:    #1b455b;
  --neon-oudo:  #e2c27f;   /* 墨地の上で読める金 */
  --neon-kusa:  #e2c27f;

  --serif: 'Shippori Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
  --sans:  'Noto Sans JP', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif;
  --band-h: 64px;          /* 画面下の行列の帯の高さ */
}

html, body { font-family: var(--sans); background: var(--ink); }
#stage-scaler { background: radial-gradient(circle at 50% 30%, #f3efe6 0%, var(--paper) 55%, #d9d2c0 100%); }
#stage {
  background-color: var(--paper);
  background-image: url('images/bk.svg');
  background-size: cover; background-position: center;
}
#stage::after { opacity: .25; }

/* 書体：筆文字・等幅をやめ、サイトと同じ明朝（見出し）＋ゴシック（本文・英字ラベル）に */
.font-fude, .slide-title, .event-card .ec-title, .closing .big-fude, .cover .cover-fude,
.standby .sb-main, .section .section-title, .pitch-name {
  font-family: var(--serif) !important; font-weight: 800;
}
